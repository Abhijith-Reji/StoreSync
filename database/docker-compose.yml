name: stocksync

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stocksync_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in your .env file}
      POSTGRES_DB: ${DB_NAME:-stocksync_local}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - stocksync_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stocksync_admin} -d ${DB_NAME:-stocksync_local}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stocksync-network

volumes:
  stocksync_pgdata:
    name: stocksync_pgdata

networks:
  stocksync-network:
    name: stocksync-network
    driver: bridge
